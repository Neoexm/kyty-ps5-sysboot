name: Build kyty-ps5-sysboot

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # firmware/ is ~3.4 GB of LFS objects and only needed at run time
          lfs: false

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: cmd
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          lld-link --version
          glslangValidator --version

      # no IPO: KytyGuestJumpSaveMask/RestoreMask are only referenced from inline asm and LTO drops them
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER=lld-link -DCMAKE_AR=llvm-lib -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DKYTY_BUILD_LAUNCHER=OFF

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target kyty_emulator kyty_sysboot --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install
          # third-party install rules add headers and static libs nobody running the exe needs
          Remove-Item -Recurse -Force _Build/windows/install/include, _Build/windows/install/lib -ErrorAction SilentlyContinue
          Get-ChildItem _Build/windows/install -Recurse -File | ForEach-Object { $_.FullName }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kyty-ps5-sysboot-windows-x64
          path: _Build/windows/install/**
          if-no-files-found: error
