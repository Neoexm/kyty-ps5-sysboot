; Copy to kyty.ini (git-ignored) and fill in. Relative paths resolve from the repo root.

[paths]
; files the boot reads; layout in README.md
firmware = firmware
; run folders land in <evidence>/runs/manual_boots
evidence = evidence
emulator = _Build/vsh/kyty_emulator.exe

[provider]
; HMAC token written by the bridge's provision-envelope-provider.py. Pass the path, never the token itself.
token_file =
port = 9038
; 300000 is the most the emulator accepts; console decrypts of large bundles take a while
timeout_ms = 300000

[boot]
; same as --readbacks: dump presented frames to the run folder
readbacks = no
; same as --show-services: give every spawned service its own window
show_services = no
